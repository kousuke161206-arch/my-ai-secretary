name: AI Stock Check

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        # ★ここが進化！google-generativeai を追加しました
        run: pip install yfinance requests google-generativeai pandas

      - name: Run script
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # ★ここが進化！APIキーをプログラムに渡す設定を追加しました
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python sbi_ai_bot.py
