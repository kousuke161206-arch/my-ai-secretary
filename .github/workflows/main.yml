name: AI Stock Check

on:
  schedule:
    # 30分おきに実行する設定（*/30 は「30分ごと」という意味です）
    - cron: '*/30 * * * *'
  workflow_dispatch: # 手動実行ボタンも残しておきます

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v3

      - name: Pythonをセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 必要なライブラリをインストール
        run: pip install yfinance requests

      - name: プログラムを実行
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python sbi_ai_bot.py
