name: AI Stock Check

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          # バージョンを 3.10 に上げて警告を消します
          python-version: '3.10'

      - name: Install dependencies
        # 最新のライブラリを指定
        run: pip install yfinance requests google-generativeai pandas

      - name: Run script
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python sbi_ai_bot.py
